name: CI

# Every push: install, typecheck, unit tests, production build, and the database tests (their own throwaway
# Postgres 16 cluster, including the concurrency test). Pull requests also run the end-to-end tests against a
# development server on a local database (development sign-in, local receipts, no Turnstile).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Every page that reads the database is rendered on request, so the build never connects to it.
          SITE_URL: https://crystalroyal.example
          DATABASE_URL: postgres://build:build@127.0.0.1:1/build
          DRAFT_COOKIE_SECRET: ci-build-only-not-a-real-secret-0123456789

  database:
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          /usr/lib/postgresql/16/bin/postgres --version
      - run: npm ci
      - name: Database tests (constraints, unit assignment, transitions, hold expiry, references, concurrency, cron)
        run: npm run test:db

  e2e:
    name: End-to-end (desktop and mobile)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE_URL: http://localhost:3100
      DATABASE_URL: postgres://postgres@127.0.0.1:54329/crtest
      DRAFT_COOKIE_SECRET: ci-e2e-only-not-a-real-secret-0123456789
      LOCAL_ADMIN_PASSWORD: ci-e2e-admin-password
      E2E_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
      - run: npm ci
      - name: Local database (migrations and seed)
        run: npm run db:up
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start the site
        run: |
          nohup npx next dev -p 3100 > next-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:3100/; then echo "ready"; exit 0; fi
            sleep 2
          done
          cat next-dev.log
          exit 1
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Server log
        if: failure()
        run: tail -n 200 next-dev.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
